<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Simple Voice Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="app-title">Voice Chat App</div>
            <div class="user-info">
                <p>Your Name:</p>
                <span id="yourId">Connecting...</span>
            </div>
            <div class="user-list">
                <p>Connected Users:</p>
                <ul id="users"></ul>
            </div>
            <button id="startStreamButton" class="btn">Start Streaming</button>
            <button id="muteButton" class="btn secondary-btn">Mute Mic</button>
            <button id="pushToTalkButton" class="btn secondary-btn hidden" type="button">Hold to Talk</button>
            <div id="audioStatus" class="audio-status">Initializing microphone...</div>

            <div class="settings-panel">
                <div class="settings-title">Voice Settings</div>
                <label class="settings-label" for="nicknameInput">Nickname</label>
                <input id="nicknameInput" class="settings-input" type="text" maxlength="24" placeholder="Set your nickname">
                <label class="setting-option" for="modeVoiceActivated">
                    <input id="modeVoiceActivated" type="radio" name="audioMode" value="voice-activated">
                    <span>Voice Activated</span>
                </label>
                <label class="setting-option" for="modePushToTalk">
                    <input id="modePushToTalk" type="radio" name="audioMode" value="push-to-talk">
                    <span>Push to Talk</span>
                </label>
                <p id="settingsHint" class="settings-hint"></p>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Chat Section -->
            <div class="chat-section">
                <div class="chat-header">Chat</div>
                <div id="chatWindow" class="chat-window">
                    <!-- Messages will appear here -->
                </div>
                <div class="chat-input">
                    <input type="text" id="chatInput" placeholder="Type your message...">
                    <button id="sendButton" class="btn">Send</button>
                </div>
            </div>

            <!-- Screen Sharing Section -->
            <div id="screenSharingSection" class="screen-sharing-section hidden">
                <div id="screenHeader" class="screen-header">Screen Sharing</div>
                <div id="screenContainer" class="screen-container">
                    <video id="screenVideo" autoplay playsinline controls></video>
                </div>
            </div>
        </div>
    </div>
	
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
